services:
  - type: web
    name: stok-satis-takip
    env: python
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: TZ
        value: Europe/Istanbul
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
